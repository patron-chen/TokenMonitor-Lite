name: Release Windows x64

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate release version
        id: version
        run: |
          $version = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version")
          {
            throw "Tag $env:GITHUB_REF_NAME must match package.json (v$version)."
          }

          $lock = Get-Content -Raw -LiteralPath package-lock.json | ConvertFrom-Json -AsHashtable
          $tauri = Get-Content -Raw -LiteralPath src-tauri/tauri.conf.json | ConvertFrom-Json
          $metadata = cargo metadata --locked --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rust = ($metadata | ConvertFrom-Json).packages[0]
          $versions = @{
            'package-lock.json' = $lock.version
            'package-lock.json root package' = $lock.packages[''].version
            'src-tauri/Cargo.toml' = $rust.version
            'src-tauri/tauri.conf.json' = $tauri.version
          }
          foreach ($entry in $versions.GetEnumerator())
          {
            if ($entry.Value -cne $version) { throw "$($entry.Key) must use version $version." }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=release/Token-Monitor-Lite-$version-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Check frontend
        run: npm run check

      - name: Build portable ZIP
        run: npm run dist:win

      - name: Test Rust
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = $env:RELEASE_ARCHIVE
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing archive $zip." }

          $release = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0)
          {
            $options = @('--verify-tag', '--generate-notes', '--title', "Token Monitor Lite $tag")
            if ($env:RELEASE_VERSION -match '^[^-+]+-') { $options += '--prerelease' }
            gh release create $tag $zip @options
            exit $LASTEXITCODE
          }

          # A retry can complete a draft or add its missing ZIP.
          $state = $release | ConvertFrom-Json
          $name = Split-Path -Leaf $zip
          if ($name -cnotin @($state.assets.name))
          {
            gh release upload $tag $zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($state.isDraft)
          {
            gh release edit $tag --draft=false
            exit $LASTEXITCODE
          }
