[package]
name = "token-monitor-lite"
version = "0.1.16"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "System", "UI_Composition_Desktop", "Win32_Foundation", "Win32_System_WinRT_Composition",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading",
  "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
